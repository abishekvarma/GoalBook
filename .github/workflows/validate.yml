name: Validate Project Physique 40

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontend JavaScript syntax
        run: node --check public/app.js
      - name: Check Python syntax
        run: python -m py_compile api/index.py tests/test_api.py
      - name: Check JSON configuration
        run: python -c "import json; json.load(open('vercel.json')); json.load(open('public/manifest.webmanifest'))"
